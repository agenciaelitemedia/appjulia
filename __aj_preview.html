<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="/src/index.css">
<style>body{padding:24px} .row{display:flex;gap:16px}</style></head>
<body>
<h1 class="text-2xl font-bold text-brand-gradient">CRM de Notificações</h1>
<div class="row" style="margin-top:16px">
  <div class="aj-column-shell rounded-xl overflow-hidden" style="--stage-color:326 70% 40%;width:280px">
    <div class="aj-column-head p-3 flex items-center gap-2">
      <span class="w-3 h-3 rounded-full" style="background:#b02a7a"></span>
      <h3 class="aj-title-gradient font-semibold text-sm">Qualificado</h3>
      <span class="text-xs bg-secondary text-secondary-foreground px-2 rounded">12</span>
    </div>
    <div class="px-3 py-2 text-xs text-muted-foreground border-b bg-background/40">Total: R$ 12.000</div>
    <div class="p-2 space-y-2 min-h-[200px]">
      <div class="aj-card-hover bg-card border border-border/70 rounded-lg p-3">
        <p class="text-sm font-medium">João da Silva</p>
        <p class="text-xs text-muted-foreground">Atualizado há 2 horas</p>
      </div>
      <button class="aj-focus-ring aj-glass-primary rounded-md px-3 py-2 text-sm" autofocus>Botão com foco</button>
    </div>
  </div>
  <div class="aj-column-shell rounded-xl overflow-hidden" style="--stage-color:200 80% 45%;width:280px">
    <div class="aj-column-head p-3 flex items-center gap-2">
      <span class="w-3 h-3 rounded-full" style="background:#1a90cf"></span>
      <h3 class="aj-title-gradient font-semibold text-sm">Sem resposta</h3>
    </div>
    <div class="p-2 aj-drop-active min-h-[200px] rounded-b-xl"></div>
  </div>
</div>
</body></html>
