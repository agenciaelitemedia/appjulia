<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Chat preview</title>
<link rel="stylesheet" href="/src/index.css"></head>
<body>
<div id="wrap" style="display:flex;height:100vh;font-family:'Plus Jakarta Sans',sans-serif">
  <div style="width:360px;display:flex;flex-direction:column" class="bg-background border-r">
    <div class="flex border-b">
      <button class="flex-1 py-2 text-xs font-semibold border-b-2 border-transparent text-muted-foreground">Encerradas</button>
      <button class="flex-1 py-2 text-xs font-semibold border-b-2 border-amber-500 text-amber-700 dark:text-amber-400 bg-amber-500/10">Aguardando <span class="rounded-full px-1 text-[9px] font-bold bg-amber-600 text-primary-foreground">12</span></button>
      <button class="flex-1 py-2 text-xs font-semibold border-b-2 border-transparent text-muted-foreground">Atendimento</button>
    </div>
    <div class="flex-1 overflow-y-auto before:sticky before:top-0 before:block before:h-[2px] before:-mb-[2px] before:content-[''] before:bg-amber-500/70">
      <div class="aj-chat-item-active flex items-start gap-3 px-3 py-3 border-b border-border/50 border-l-[4px] border-l-transparent">
        <div class="h-12 w-12 rounded-full bg-secondary text-secondary-foreground flex items-center justify-center font-semibold">JS</div>
        <div class="flex-1"><div class="text-sm font-semibold">João da Silva</div><div class="text-[10px] text-muted-foreground">Bom dia, tudo bem?</div>
        <span class="mt-1 inline-flex items-center px-1.5 h-5 text-[9px] font-bold rounded bg-emerald-500/15 text-emerald-700 dark:text-emerald-300">JULIA</span></div>
        <span class="bg-emerald-600 text-primary-foreground text-[11px] font-bold rounded-full px-1.5 h-5 flex items-center">3</span>
      </div>
      <div class="flex items-start gap-3 px-3 py-3 border-b border-border/50 bg-muted/25">
        <div class="h-12 w-12 rounded-full bg-secondary text-secondary-foreground flex items-center justify-center font-semibold">MA</div>
        <div class="flex-1"><div class="text-sm font-semibold">Maria Antunes</div><div class="text-[10px] text-muted-foreground">Obrigada!</div></div>
      </div>
    </div>
  </div>
  <div style="flex:1;display:flex;flex-direction:column">
    <div class="border-b aj-chat-bar aj-chat-bar-top p-3 flex items-center gap-3">
      <div class="h-10 w-10 rounded-full bg-[image:var(--gradient-brand)] text-primary-foreground flex items-center justify-center font-semibold ring-1 ring-border/70">JS</div>
      <div><div class="font-semibold text-sm">João da Silva</div>
      <div class="flex gap-0 mt-1"><span class="h-5 px-1.5 text-[9px] font-bold flex items-center bg-[image:var(--gradient-brand)] text-primary-foreground rounded-l w-[110px] justify-center">Fila Principal</span><span class="h-5 px-1.5 text-[9px] flex items-center justify-center bg-secondary text-secondary-foreground w-[110px]">Ana Souza</span></div>
      <div class="mt-1 flex gap-1"><span class="text-[10px] px-1.5 py-0.5 rounded border bg-emerald-500/12 text-emerald-700 dark:text-emerald-400 border-emerald-500/35">Em atendimento</span><span class="text-[10px] px-1.5 py-0.5 rounded border text-emerald-700 dark:text-emerald-400 border-emerald-500/30 bg-emerald-500/10">WhatsApp</span></div></div>
    </div>
    <div class="flex-1 overflow-y-auto p-4 aj-chat-canvas space-y-2">
      <div class="flex justify-center my-4"><div class="aj-chat-chip px-3 py-1 rounded-full text-xs font-medium text-muted-foreground">Hoje</div></div>
      <div class="flex"><div class="aj-bubble-in rounded-lg rounded-bl-none px-3 py-2 text-foreground max-w-[70%] text-sm">Oi, preciso de ajuda com meu processo trabalhista.</div></div>
      <div class="flex justify-end"><div class="aj-bubble-out rounded-lg rounded-br-none px-3 py-2 text-foreground max-w-[70%] text-sm">Claro! Vou verificar agora mesmo para você. <span class="block text-[10px] text-muted-foreground mt-1">10:42</span></div></div>
      <div class="flex"><div class="aj-bubble-in rounded-lg rounded-bl-none px-3 py-2 text-foreground max-w-[70%] text-sm">Obrigado 🙏</div></div>
    </div>
    <div class="border-t aj-chat-bar aj-chat-bar-bottom p-3 flex gap-2 items-center">
      <input class="flex-1 h-9 rounded-md border border-input bg-background px-3 text-sm" placeholder="Mensagem">
      <button class="h-9 w-9 rounded-md bg-primary text-primary-foreground">→</button>
    </div>
  </div>
</div>
</body></html>
