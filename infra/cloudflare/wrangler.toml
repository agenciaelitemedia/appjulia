name = "mcp-atendejulia"
main = "mcp-proxy-worker.js"
compatibility_date = "2026-08-29"

# Domínio customizado — o Cloudflare cria DNS + certificado automaticamente
routes = [
  { pattern = "mcp.atendejulia.com.br", custom_domain = true }
]

[vars]
# Substitua pela base real do seu projeto quando for fazer deploy
# BACKEND_FUNCTIONS_BASE = "https://zenizgyrwlonmufxnjqt.supabase.co/functions/v1"
# ISSUER = "https://mcp.atendejulia.com.br"

# Variáveis sensíveis devem ser definidas via secrets:
# wrangler secret put BACKEND_FUNCTIONS_BASE
# wrangler secret put ISSUER
